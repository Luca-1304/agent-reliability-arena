name: Temporary Ashby form inspection

on:
  push:
    branches:
      - temp/inspect-ashby-form
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch exact rendered Ashby form
        run: |
          set -euo pipefail
          cat > query.graphql <<'GRAPHQL'
          query ApiJobPosting($organizationHostedJobsPageName: String!, $jobPostingId: String!) {
            jobPosting(
              organizationHostedJobsPageName: $organizationHostedJobsPageName
              jobPostingId: $jobPostingId
            ) {
              id
              title
              applicationForm { ...FormRenderParts }
              surveyForms { ...FormRenderParts }
              shouldAskForTextingConsent
              shouldAskForWhatsAppConsent
              applicationLimitCalloutHtml
            }
          }

          fragment JSONBoxParts on JSONBox {
            value
          }

          fragment FileParts on File {
            id
            filename
          }

          fragment FormFieldEntryParts on FormFieldEntry {
            id
            field
            fieldValue {
              ... on JSONBox { ...JSONBoxParts }
              ... on File { ...FileParts }
              ... on FileList { files { ...FileParts } }
            }
            isRequired
            descriptionHtml
            isHidden
          }

          fragment FormRenderParts on FormRender {
            id
            formControls { identifier title }
            errorMessages
            formErrors { message fieldEntryId }
            sections {
              title
              descriptionHtml
              fieldEntries { ...FormFieldEntryParts }
              isHidden
            }
            sourceFormDefinitionId
          }
          GRAPHQL

          python - <<'PY'
          import json
          from pathlib import Path
          payload = {
              'operationName': 'ApiJobPosting',
              'variables': {
                  'organizationHostedJobsPageName': 'Ashby',
                  'jobPostingId': 'e5863f7c-2238-410f-9a72-d40c944d2511',
              },
              'query': Path('query.graphql').read_text(),
          }
          Path('payload.json').write_text(json.dumps(payload), encoding='utf-8')
          PY

          curl --fail-with-body --silent --show-error \
            --request POST 'https://jobs.ashbyhq.com/api/non-user-graphql?op=ApiJobPosting' \
            --header 'Content-Type: application/json' \
            --data-binary @payload.json \
            --output response.json

      - name: Print exact form fields
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('response.json').read_text())
          print(json.dumps(data, indent=2, ensure_ascii=False, sort_keys=True))
          if data.get('errors'):
              raise SystemExit('Ashby returned GraphQL errors')

          posting = (data.get('data') or {}).get('jobPosting') or {}
          forms = [posting.get('applicationForm'), *(posting.get('surveyForms') or [])]
          fields = []
          for form in forms:
              if not form:
                  continue
              for section in form.get('sections') or []:
                  for entry in section.get('fieldEntries') or []:
                      field = entry.get('field')
                      if isinstance(field, str):
                          try:
                              field = json.loads(field)
                          except json.JSONDecodeError:
                              pass
                      fields.append({
                          'section': section.get('title'),
                          'isRequired': entry.get('isRequired'),
                          'isHidden': entry.get('isHidden'),
                          'descriptionHtml': entry.get('descriptionHtml'),
                          'field': field,
                      })
          Path('fields.json').write_text(
              json.dumps(fields, indent=2, ensure_ascii=False, sort_keys=True),
              encoding='utf-8',
          )
          print('\n===== NORMALIZED FIELDS =====')
          print(Path('fields.json').read_text())
          PY

      - name: Upload form response
        uses: actions/upload-artifact@v4
        with:
          name: ashby-form-schema
          path: |
            response.json
            fields.json
          retention-days: 1
