name: Temporary Ashby form inspection

on:
  push:
    branches:
      - temp/inspect-ashby-form
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Ashby GraphQL schema
        run: |
          cat > payload.json <<'JSON'
          {
            "operationName": "InspectJobPostingDetails",
            "variables": {},
            "query": "query InspectJobPostingDetails { __type(name: \"JobPostingDetails\") { name fields { name type { kind name ofType { kind name ofType { kind name } } } } } }"
          }
          JSON

          curl --fail-with-body --silent --show-error \
            --request POST 'https://jobs.ashbyhq.com/api/non-user-graphql?op=InspectJobPostingDetails' \
            --header 'Content-Type: application/json' \
            --data-binary @payload.json \
            --output response.json

      - name: Print schema result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('response.json').read_text())
          print(json.dumps(data, indent=2, sort_keys=True))
          if data.get('errors'):
              raise SystemExit('Ashby GraphQL returned errors')
          PY

      - name: Upload response
        uses: actions/upload-artifact@v4
        with:
          name: ashby-form-schema
          path: response.json
          retention-days: 1
