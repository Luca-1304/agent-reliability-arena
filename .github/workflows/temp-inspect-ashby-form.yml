name: Temporary Ashby form inspection

on:
  push:
    branches:
      - temp/inspect-ashby-form
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch public Ashby application form schema
        run: |
          cat > payload.json <<'JSON'
          {
            "operationName": "ApiApplicationFormQuery",
            "variables": {
              "jobPostingId": "e5863f7c-2238-410f-9a72-d40c944d2511"
            },
            "query": "query ApiApplicationFormQuery($jobPostingId: String!) { jobPosting(id: $jobPostingId) { id title applicationFormDefinition { sections { title descriptionPlain fields { path isRequired descriptionPlain type selectableValues { label value } } } } } }"
          }
          JSON

          curl --fail-with-body --silent --show-error \
            --request POST 'https://jobs.ashbyhq.com/api/non-user-graphql?op=ApiApplicationFormQuery' \
            --header 'Content-Type: application/json' \
            --data-binary @payload.json \
            --output response.json

      - name: Print exact field schema
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('response.json').read_text())
          print(json.dumps(data, indent=2, sort_keys=True))
          if data.get('errors'):
              raise SystemExit('Ashby GraphQL returned errors')
          PY

      - name: Upload response
        uses: actions/upload-artifact@v4
        with:
          name: ashby-form-schema
          path: response.json
          retention-days: 1
