name: Reliability Specialist Gates

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "examples/**"
      - "security/**"
      - "release/**"
      - "reference_runs/**"
      - "web/**"
      - "docs/**"
      - "citation/**"
      - "requirements/**"
      - "schemas/**"
      - "reliability-policy.json"
      - "pyproject.toml"
      - "README.md"
      - "CHANGELOG.md"
      - "ROADMAP.md"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "examples/**"
      - "security/**"
      - "release/**"
      - "reference_runs/**"
      - "web/**"
      - "docs/**"
      - "citation/**"
      - "requirements/**"
      - "schemas/**"
      - "reliability-policy.json"
      - "pyproject.toml"
      - "README.md"
      - "CHANGELOG.md"
      - "ROADMAP.md"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  TZ: UTC
  LC_ALL: C.UTF-8
  LANG: C.UTF-8
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  SOURCE_DATE_EPOCH: "315532800"
  ARENA_RELIABILITY_STABLE_OUTPUT: "1"

concurrency:
  group: reliability-specialists-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  reproducible-build:
    name: Specialist — Reproducible build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out exact tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements/ci-tools.txt
      - name: Install hash-locked CI toolchain
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input --require-hashes -r requirements/ci-tools.txt
      - name: Verify reproducible wheel contents
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/reproducible-build-evidence"
          rm -rf "$evidence"
          mkdir -p "$evidence"
          python scripts/ci/verify_reproducible_build.py \
            --workspace "$GITHUB_WORKSPACE" \
            --work-root "$RUNNER_TEMP/reproducible-build-work" \
            --output "$evidence/report.json"
      - name: Scan specialist evidence
        id: scan
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          python scripts/ci/scan_diagnostics.py \
            --root "$RUNNER_TEMP/reproducible-build-evidence" \
            --workspace "$GITHUB_WORKSPACE" \
            --policy reliability-policy.json \
            --output "$RUNNER_TEMP/reproducible-build-scan.json"
      - name: Upload scanned specialist evidence
        if: always() && steps.scan.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: reliability-reproducible-build-${{ github.run_attempt }}
          path: ${{ runner.temp }}/reproducible-build-evidence
          if-no-files-found: error
          retention-days: 14
          compression-level: 9
      - name: Upload blocked scanner report
        if: always() && steps.scan.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: reliability-reproducible-build-blocked-${{ github.run_attempt }}
          path: ${{ runner.temp }}/reproducible-build-scan.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 9
      - name: Enforce evidence privacy boundary
        if: always() && steps.scan.outcome == 'failure'
        shell: bash
        run: exit 1

  explicit-determinism:
    name: Specialist — Explicit determinism
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out exact tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements/ci-tools.txt
      - name: Install package and CI toolchain
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input --require-hashes -r requirements/ci-tools.txt
          python -m pip install --disable-pip-version-check --no-input --no-build-isolation --editable .
      - name: Produce two independent fixture runs
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/determinism-work"
          evidence="$RUNNER_TEMP/determinism-evidence"
          rm -rf "$work" "$evidence"
          mkdir -p "$work" "$evidence"
          arena-run --config examples/fixture_experiment.json --output "$work/run-a-artifacts" > "$work/run-a.json"
          arena-run --config examples/fixture_experiment.json --output "$work/run-b-artifacts" > "$work/run-b.json"
          python scripts/ci/verify_determinism.py \
            --policy reliability-policy.json \
            --output-key fixture_run \
            --left "$work/run-a.json" \
            --right "$work/run-b.json" \
            --output "$evidence/report.json"
      - name: Scan specialist evidence
        id: scan
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          python scripts/ci/scan_diagnostics.py \
            --root "$RUNNER_TEMP/determinism-evidence" \
            --workspace "$GITHUB_WORKSPACE" \
            --policy reliability-policy.json \
            --output "$RUNNER_TEMP/determinism-scan.json"
      - name: Upload scanned specialist evidence
        if: always() && steps.scan.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: reliability-determinism-${{ github.run_attempt }}
          path: ${{ runner.temp }}/determinism-evidence
          if-no-files-found: error
          retention-days: 14
          compression-level: 9
      - name: Upload blocked scanner report
        if: always() && steps.scan.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: reliability-determinism-blocked-${{ github.run_attempt }}
          path: ${{ runner.temp }}/determinism-scan.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 9
      - name: Enforce evidence privacy boundary
        if: always() && steps.scan.outcome == 'failure'
        shell: bash
        run: exit 1

  clean-room:
    name: Specialist — Clean room
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out exact tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements/ci-tools.txt
      - name: Install hash-locked CI toolchain
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input --require-hashes -r requirements/ci-tools.txt
      - name: Build wheel input
        shell: bash
        run: |
          set -euo pipefail
          dist="$RUNNER_TEMP/clean-room-input"
          rm -rf "$dist"
          mkdir -p "$dist"
          python -m pip wheel --disable-pip-version-check --no-input --no-deps --no-build-isolation --wheel-dir "$dist" .
          test "$(find "$dist" -maxdepth 1 -name '*.whl' -type f | wc -l)" -eq 1
      - name: Verify cold clean-room execution
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/clean-room-evidence"
          rm -rf "$evidence"
          mkdir -p "$evidence"
          wheel="$(find "$RUNNER_TEMP/clean-room-input" -maxdepth 1 -name '*.whl' -type f -print -quit)"
          python scripts/ci/verify_clean_room.py \
            --wheel "$wheel" \
            --config examples/fixture_experiment.json \
            --workspace "$GITHUB_WORKSPACE" \
            --root "$RUNNER_TEMP/clean-room-work" \
            --output "$evidence/report.json"
      - name: Scan specialist evidence
        id: scan
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          python scripts/ci/scan_diagnostics.py \
            --root "$RUNNER_TEMP/clean-room-evidence" \
            --workspace "$GITHUB_WORKSPACE" \
            --policy reliability-policy.json \
            --output "$RUNNER_TEMP/clean-room-scan.json"
      - name: Upload scanned specialist evidence
        if: always() && steps.scan.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: reliability-clean-room-${{ github.run_attempt }}
          path: ${{ runner.temp }}/clean-room-evidence
          if-no-files-found: error
          retention-days: 14
          compression-level: 9
      - name: Upload blocked scanner report
        if: always() && steps.scan.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: reliability-clean-room-blocked-${{ github.run_attempt }}
          path: ${{ runner.temp }}/clean-room-scan.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 9
      - name: Enforce evidence privacy boundary
        if: always() && steps.scan.outcome == 'failure'
        shell: bash
        run: exit 1

  concurrency-isolation:
    name: Specialist — Concurrency isolation
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out exact tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements/ci-tools.txt
      - name: Install package and CI toolchain
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input --require-hashes -r requirements/ci-tools.txt
          python -m pip install --disable-pip-version-check --no-input --no-build-isolation --editable .
      - name: Verify concurrent run-state isolation
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/concurrency-evidence"
          rm -rf "$evidence"
          mkdir -p "$evidence"
          python scripts/ci/verify_concurrency.py \
            --executable "$(command -v arena-run)" \
            --config examples/fixture_experiment.json \
            --root "$RUNNER_TEMP/concurrency-work" \
            --output "$evidence/report.json"
      - name: Scan specialist evidence
        id: scan
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          python scripts/ci/scan_diagnostics.py \
            --root "$RUNNER_TEMP/concurrency-evidence" \
            --workspace "$GITHUB_WORKSPACE" \
            --policy reliability-policy.json \
            --output "$RUNNER_TEMP/concurrency-scan.json"
      - name: Upload scanned specialist evidence
        if: always() && steps.scan.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: reliability-concurrency-${{ github.run_attempt }}
          path: ${{ runner.temp }}/concurrency-evidence
          if-no-files-found: error
          retention-days: 14
          compression-level: 9
      - name: Upload blocked scanner report
        if: always() && steps.scan.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: reliability-concurrency-blocked-${{ github.run_attempt }}
          path: ${{ runner.temp }}/concurrency-scan.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 9
      - name: Enforce evidence privacy boundary
        if: always() && steps.scan.outcome == 'failure'
        shell: bash
        run: exit 1

  diagnostic-security:
    name: Specialist — Diagnostic security
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: Prove the scanner blocks synthetic leaks without echoing values
        shell: bash
        run: |
          set -euo pipefail
          probe="$RUNNER_TEMP/diagnostic-security-probe"
          evidence="$RUNNER_TEMP/diagnostic-security-evidence"
          report="$evidence/leak-scan.json"
          rm -rf "$probe" "$evidence"
          mkdir -p "$probe" "$evidence"
          printf '%s\n' 'OPENAI_API_KEY=sk-example-not-real' 'callback=http://localhost:8080/run?token=not-real' > "$probe/probe.log"
          if python scripts/ci/scan_diagnostics.py \
            --root "$probe" \
            --workspace "$GITHUB_WORKSPACE" \
            --policy reliability-policy.json \
            --output "$report"; then
            echo "scanner unexpectedly accepted synthetic leak evidence" >&2
            exit 1
          fi
          python - "$report" <<'PY'
          import json
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          payload = json.loads(path.read_text(encoding="utf-8"))
          text = path.read_text(encoding="utf-8")
          if payload.get("status") != "blocked" or int(payload.get("finding_count", 0)) < 2:
              raise SystemExit("scanner did not record the expected blocked findings")
          for forbidden in ("sk-example-not-real", "not-real", "localhost"):
              if forbidden in text:
                  raise SystemExit(f"scanner report leaked forbidden probe value: {forbidden}")
          PY
          printf '%s\n' '{"schema_version":"diagnostic-security-v1","status":"passed","probe":"synthetic-secret-and-private-host"}' > "$evidence/summary.json"
      - name: Scan specialist evidence
        id: scan
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          python scripts/ci/scan_diagnostics.py \
            --root "$RUNNER_TEMP/diagnostic-security-evidence" \
            --workspace "$GITHUB_WORKSPACE" \
            --policy reliability-policy.json \
            --output "$RUNNER_TEMP/diagnostic-security-scan.json"
      - name: Upload scanned specialist evidence
        if: always() && steps.scan.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: reliability-diagnostic-security-${{ github.run_attempt }}
          path: ${{ runner.temp }}/diagnostic-security-evidence
          if-no-files-found: error
          retention-days: 14
          compression-level: 9
      - name: Upload blocked scanner report
        if: always() && steps.scan.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: reliability-diagnostic-security-blocked-${{ github.run_attempt }}
          path: ${{ runner.temp }}/diagnostic-security-scan.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 9
      - name: Enforce evidence privacy boundary
        if: always() && steps.scan.outcome == 'failure'
        shell: bash
        run: exit 1

  summary:
    name: Specialist — Role evidence summary
    needs: [reproducible-build, explicit-determinism, clean-room, concurrency-isolation, diagnostic-security]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Create authoritative Specialist role record
        env:
          REPRO_RESULT: ${{ needs.reproducible-build.result }}
          DETERMINISM_RESULT: ${{ needs.explicit-determinism.result }}
          CLEAN_ROOM_RESULT: ${{ needs.clean-room.result }}
          CONCURRENCY_RESULT: ${{ needs.concurrency-isolation.result }}
          DIAGNOSTIC_RESULT: ${{ needs.diagnostic-security.result }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/specialist-role-evidence"
          rm -rf "$evidence"
          mkdir -p "$evidence"
          python - "$evidence/manifest.json" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          components = {
              "reproducible-build": os.environ.get("REPRO_RESULT", "unknown").lower(),
              "explicit-determinism": os.environ.get("DETERMINISM_RESULT", "unknown").lower(),
              "clean-room": os.environ.get("CLEAN_ROOM_RESULT", "unknown").lower(),
              "concurrency-isolation": os.environ.get("CONCURRENCY_RESULT", "unknown").lower(),
              "diagnostic-security": os.environ.get("DIAGNOSTIC_RESULT", "unknown").lower(),
          }
          values = set(components.values())
          if values == {"success"}:
              status = "passed"
          elif "failure" in values:
              status = "failed"
          elif "cancelled" in values:
              status = "blocked"
          else:
              status = "unknown"
          payload = {
              "schema_version": "layered-reliability-role-v1",
              "role": "specialist",
              "required": True,
              "status": status,
              "source_sha": os.environ.get("SOURCE_SHA", ""),
              "workflow": os.environ.get("GITHUB_WORKFLOW", ""),
              "run_id": os.environ.get("GITHUB_RUN_ID", ""),
              "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT", ""),
              "components": components,
          }
          Path(sys.argv[1]).write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

      - name: Generate Specialist human summary
        id: summarize
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/specialist-role-evidence"
          python scripts/ci/summarize_reliability.py \
            --manifest "$evidence/manifest.json" \
            --required-role specialist \
            --minimum-prior-samples 10 \
            --output-json "$evidence/summary.json" \
            --output-md "$evidence/summary.md"

      - name: Scan Specialist role evidence
        id: scan
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          python scripts/ci/scan_diagnostics.py \
            --root "$RUNNER_TEMP/specialist-role-evidence" \
            --workspace "$GITHUB_WORKSPACE" \
            --policy reliability-policy.json \
            --output "$RUNNER_TEMP/specialist-role-scan.json"

      - name: Publish Specialist role summary
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/specialist-role-evidence/summary.md" ]]; then
            cat "$RUNNER_TEMP/specialist-role-evidence/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload scanned Specialist role evidence
        if: always() && steps.scan.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: reliability-specialist-role-${{ github.run_attempt }}
          path: ${{ runner.temp }}/specialist-role-evidence
          if-no-files-found: error
          retention-days: 14
          compression-level: 9

      - name: Upload blocked Specialist scanner report
        if: always() && steps.scan.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: reliability-specialist-role-blocked-${{ github.run_attempt }}
          path: ${{ runner.temp }}/specialist-role-scan.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 9

      - name: Enforce Specialist role result and evidence boundary
        if: always() && (steps.summarize.outcome == 'failure' || steps.scan.outcome == 'failure')
        shell: bash
        run: exit 1
