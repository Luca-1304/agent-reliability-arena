name: Purge known unsafe Pages artifact

on:
  push:
    branches: [main]

permissions:
  actions: write
  contents: read

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Delete and verify artifact removal
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: "8839994303"
        run: |
          set -euo pipefail
          gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}"
          if gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}" >/dev/null 2>&1; then
            echo "Artifact still exists after deletion." >&2
            exit 1
          fi
          echo "Artifact deletion verified."
