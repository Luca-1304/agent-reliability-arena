name: Deploy portfolio and verified Arena to GitHub Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Verify and package public site
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install PDF privacy verifier
        run: |
          sudo apt-get update
          sudo apt-get install --yes poppler-utils

      - name: Install package
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --editable .

      - name: Verify locked public packages
        run: |
          python scripts/verify_showcase_release.py
          python scripts/verify_launch_package.py
          python scripts/verify_audit_package.py
          python scripts/verify_public_cv.py
          python -m unittest tests.test_pages_site tests.test_lean_portfolio tests.test_audit_service_page tests.test_audit_package tests.test_public_cv_privacy_contract

      - name: Stage exact Pages artifact
        run: python scripts/stage_pages_site.py --root . --output _site

      - name: Verify staged allow-list and CV privacy
        run: |
          python - <<'PY'
          from pathlib import Path

          expected = {
              ".nojekyll",
              "Luca_Panayiotou_CV.pdf",
              "arena/app.js",
              "arena/data/fixture-v1.json",
              "arena/index.html",
              "arena/styles.css",
              "audit.html",
              "desktop-headings.css",
              "evidence.html",
              "index.html",
              "interests.html",
              "portfolio.css",
              "site.js",
          }
          root = Path("_site")
          actual = {
              path.relative_to(root).as_posix()
              for path in root.rglob("*")
              if path.is_file()
          }
          assert actual == expected, (sorted(actual), sorted(expected))
          assert not any(path.is_symlink() for path in root.rglob("*"))
          PY
          python scripts/verify_public_cv.py --pdf _site/Luca_Panayiotou_CV.pdf

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Publish verified site
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Install live PDF privacy verifier
        run: |
          sudo apt-get update
          sudo apt-get install --yes poppler-utils

      - name: Verify live portfolio, CV, audit and Arena boundaries
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          test -n "$PAGE_URL"
          BASE_URL="${PAGE_URL%/}"

          curl --fail --location --retry 12 --retry-delay 5 --retry-all-errors "$BASE_URL/" -o /tmp/pages-portfolio.html
          grep -F "Luca Panayiotou" /tmp/pages-portfolio.html
          grep -F "Broad enough to build. Disciplined enough to prove." /tmp/pages-portfolio.html

          curl --fail --location --retry 12 --retry-delay 5 --retry-all-errors "$BASE_URL/Luca_Panayiotou_CV.pdf" -o /tmp/pages-public-cv.pdf
          python scripts/verify_public_cv.py --pdf /tmp/pages-public-cv.pdf

          curl --fail --location --retry 12 --retry-delay 5 --retry-all-errors "$BASE_URL/audit.html" -o /tmp/pages-audit.html
          grep -F "AI Agent Reliability Audit" /tmp/pages-audit.html
          grep -F "No production mutation or provider spend without separate written approval." /tmp/pages-audit.html

          curl --fail --location --retry 12 --retry-delay 5 --retry-all-errors "$BASE_URL/arena/" -o /tmp/pages-arena.html
          grep -F "Agent Reliability Arena — Evidence-first agent evaluation" /tmp/pages-arena.html
          grep -F "No real-provider benchmark request or provider spend has been executed." /tmp/pages-arena.html
          grep -F "comparative_claim_permitted: false" /tmp/pages-arena.html
