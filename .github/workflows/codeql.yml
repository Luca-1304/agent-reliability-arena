name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze Python
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      packages: read
    strategy:
      fail-fast: false
      matrix:
        languages: [python]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@a703997fb046009056d67585e9f1bd74fca57eb4 # v4
        with:
          languages: ${{ matrix.languages }}
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@a703997fb046009056d67585e9f1bd74fca57eb4 # v4
        with:
          category: "/language:${{ matrix.languages }}"
