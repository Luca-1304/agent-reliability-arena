name: Fifteen consecutive verification passes

on:
  pull_request:
    paths:
      - ".github/workflows/fifteen-pass-verification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Reliability Arena 15/15 — Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install editable package and build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --editable .
      - name: Run fifteen consecutive complete cycles
        shell: bash
        run: |
          set -euo pipefail
          for pass_number in $(seq 1 15); do
            echo "::group::RELIABILITY ARENA PASS ${pass_number}/15 — Python ${{ matrix.python-version }}"
            rm -rf dist build
            run_root="/tmp/arena-${{ matrix.python-version }}-${pass_number}"
            wheel_env="/tmp/arena-wheel-${{ matrix.python-version }}-${pass_number}"
            rm -rf "$run_root" "$wheel_env"
            python -m compileall -q src tests scripts
            python -m unittest discover -s tests -p "test_*.py" -v
            python scripts/verify_release.py
            python scripts/verify_disclosure_release.py
            python scripts/verify_repeated_release.py
            python scripts/verify_showcase_release.py
            python scripts/verify_launch_package.py
            python scripts/verify_citation_package.py
            python scripts/verify_supply_chain.py
            arena-run --config examples/fixture_experiment.json --output "$run_root/editable"
            arena-replay --input "$run_root/editable" > "$run_root/editable-replay.json"
            arena-export-web --input "$run_root/editable" --output "$run_root/editable-public.json"
            arena-verify-showcase --root . > "$run_root/editable-showcase.json"
            arena-verify-launch-package --root . > "$run_root/editable-launch.json"
            arena-verify-citation-package --root . > "$run_root/editable-citation.json"
            arena-verify-supply-chain --root . > "$run_root/editable-supply-chain.json"
            python -m pip wheel . --no-deps --no-build-isolation --wheel-dir dist
            python -m venv "$wheel_env"
            "$wheel_env/bin/python" -m pip install --disable-pip-version-check --no-deps dist/*.whl
            PATH="$wheel_env/bin:$PATH" "$wheel_env/bin/python" -m unittest discover -s tests -p "test_*.py" -v
            "$wheel_env/bin/python" scripts/verify_release.py
            "$wheel_env/bin/python" scripts/verify_disclosure_release.py
            "$wheel_env/bin/python" scripts/verify_repeated_release.py
            "$wheel_env/bin/python" scripts/verify_showcase_release.py
            "$wheel_env/bin/python" scripts/verify_launch_package.py
            "$wheel_env/bin/python" scripts/verify_citation_package.py
            "$wheel_env/bin/python" scripts/verify_supply_chain.py
            "$wheel_env/bin/arena-run" --config examples/fixture_experiment.json --output "$run_root/wheel"
            "$wheel_env/bin/arena-replay" --input "$run_root/wheel" > "$run_root/wheel-replay.json"
            "$wheel_env/bin/arena-export-web" --input "$run_root/wheel" --output "$run_root/wheel-public.json"
            "$wheel_env/bin/python" -m pip check
            python -m pip check
            rm -rf "$run_root" "$wheel_env" dist
            echo "::endgroup::"
          done
          echo "RELIABILITY ARENA RESULT — Python ${{ matrix.python-version }}: 15/15 PASSED"
