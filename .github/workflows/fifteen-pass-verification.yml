name: Auditable policy-driven deep reliability gate

on:
  pull_request:
    paths:
      - ".github/workflows/fifteen-pass-verification.yml"
      - ".github/workflows/**"
      - "reliability-policy.json"
      - "schemas/reliability-policy.schema.json"
      - "schemas/reliability-evidence.schema.json"
      - "scripts/ci/reliability_gate.py"
      - "scripts/ci/reliability_policy.py"
      - "scripts/ci/reliability_evidence.py"
      - "scripts/ci/run_deep_reliability.py"
      - "scripts/ci/redact_diagnostic_paths.py"
      - "scripts/ci/scan_diagnostics.py"
      - "requirements/ci-tools.txt"
      - "tests/test_reliability_gate.py"
      - "tests/test_reliability_policy.py"
      - "tests/test_reliability_evidence.py"
      - "tests/test_deep_gate_policy_adapter.py"
      - "tests/test_diagnostic_evidence_redaction.py"
      - "tests/test_diagnostic_scanner.py"
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "examples/**"
      - "security/**"
      - "release/**"
      - "reference_runs/**"
      - "web/**"
      - "docs/**"
      - "citation/**"
      - "requirements/**"
      - "schemas/**"
      - "pyproject.toml"
      - "README.md"
      - "CHANGELOG.md"
      - "ROADMAP.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/fifteen-pass-verification.yml"
      - ".github/workflows/**"
      - "reliability-policy.json"
      - "schemas/reliability-policy.schema.json"
      - "schemas/reliability-evidence.schema.json"
      - "scripts/ci/reliability_gate.py"
      - "scripts/ci/reliability_policy.py"
      - "scripts/ci/reliability_evidence.py"
      - "scripts/ci/run_deep_reliability.py"
      - "scripts/ci/redact_diagnostic_paths.py"
      - "scripts/ci/scan_diagnostics.py"
      - "requirements/ci-tools.txt"
      - "tests/test_reliability_gate.py"
      - "tests/test_reliability_policy.py"
      - "tests/test_reliability_evidence.py"
      - "tests/test_deep_gate_policy_adapter.py"
      - "tests/test_diagnostic_evidence_redaction.py"
      - "tests/test_diagnostic_scanner.py"
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "examples/**"
      - "security/**"
      - "release/**"
      - "reference_runs/**"
      - "web/**"
      - "docs/**"
      - "citation/**"
      - "requirements/**"
      - "schemas/**"
      - "pyproject.toml"
      - "README.md"
      - "CHANGELOG.md"
      - "ROADMAP.md"
  workflow_dispatch:

permissions:
  contents: read

env:
  TZ: UTC
  LC_ALL: C.UTF-8
  LANG: C.UTF-8
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  SOURCE_DATE_EPOCH: "315532800"
  ARENA_RELIABILITY_STABLE_OUTPUT: "1"

concurrency:
  group: fifteen-pass-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Policy Deep Gate — Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - name: Check out exact tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements/ci-tools.txt

      - name: Prepare bootstrap evidence
        shell: bash
        run: |
          set -euo pipefail
          diagnostics_dir="$RUNNER_TEMP/fifteen-pass-diagnostics"
          rm -rf "$diagnostics_dir"
          mkdir -p "$diagnostics_dir"
          {
            printf 'schema=reliability-gate-v2-bootstrap\n'
            printf 'python_label=%s\n' '${{ matrix.python-version }}'
            printf 'source_sha=%s\n' '${{ github.event.pull_request.head.sha || github.sha }}'
            printf 'tested_sha=%s\n' "$GITHUB_SHA"
            printf 'event=%s\n' "$GITHUB_EVENT_NAME"
            printf 'run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'run_attempt=%s\n' "$GITHUB_RUN_ATTEMPT"
            python --version
            python -m pip --version
          } > "$diagnostics_dir/bootstrap-environment.txt"

      - name: Install hash-locked CI toolchain
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input --require-hashes -r requirements/ci-tools.txt 2>&1 | tee "$RUNNER_TEMP/fifteen-pass-diagnostics/bootstrap-tools.log"

      - name: Install editable package without isolated dependency resolution
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input --no-build-isolation --editable . 2>&1 | tee "$RUNNER_TEMP/fifteen-pass-diagnostics/bootstrap-editable.log"

      - name: Run policy-governed deep reliability gate
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ci/run_deep_reliability.py \
            --policy reliability-policy.json \
            --python-label '${{ matrix.python-version }}' \
            --source-sha '${{ github.event.pull_request.head.sha || github.sha }}' \
            --tested-sha "$GITHUB_SHA" \
            --workspace "$GITHUB_WORKSPACE" \
            --work-root "$RUNNER_TEMP/reliability-work" \
            --diagnostics-dir "$RUNNER_TEMP/fifteen-pass-diagnostics"

      - name: Redact diagnostic metadata before scanning
        id: diagnostic_redaction
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          report="$RUNNER_TEMP/diagnostic-redaction-report.json"
          python scripts/ci/redact_diagnostic_paths.py \
            --root "$RUNNER_TEMP/fifteen-pass-diagnostics" \
            --workspace "$GITHUB_WORKSPACE" \
            --output "$report"
          status=$?
          if [[ ! -f "$report" ]]; then
            printf '%s\n' '{"error":"redactor did not produce a report","schema_version":"diagnostic-redaction-v1","status":"failed"}' > "$report"
          fi
          exit "$status"

      - name: Scan diagnostic evidence before publication
        id: diagnostic_scan
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          report="$RUNNER_TEMP/diagnostic-scan-report.json"
          python scripts/ci/scan_diagnostics.py \
            --root "$RUNNER_TEMP/fifteen-pass-diagnostics" \
            --workspace "$GITHUB_WORKSPACE" \
            --policy reliability-policy.json \
            --output "$report"
          status=$?
          if [[ ! -f "$report" ]]; then
            printf '%s\n' '{"finding_count":1,"findings":[{"context":"scanner did not produce a report","kind":"scanner-error","line":0,"source":"scanner"}],"scanned_files":0,"schema_version":"diagnostic-scan-v1","skipped_binary_files":0,"status":"blocked"}' > "$report"
          fi
          exit "$status"

      - name: Publish reliability evidence summary
        if: always() && steps.diagnostic_redaction.outcome == 'success' && steps.diagnostic_scan.outcome == 'success'
        shell: bash
        run: |
          diagnostics_dir="$RUNNER_TEMP/fifteen-pass-diagnostics"
          if [[ -f "$diagnostics_dir/summary.md" ]]; then
            cat "$diagnostics_dir/summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Policy Deep Gate — Python ${{ matrix.python-version }}"
              echo
              echo "The gate did not reach summary generation. Sanitised, scanned bootstrap evidence is retained in the uploaded artifact."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish blocked-diagnostics summary
        if: always() && (steps.diagnostic_redaction.outcome == 'failure' || steps.diagnostic_scan.outcome == 'failure')
        shell: bash
        run: |
          {
            echo "## Policy Deep Gate — Python ${{ matrix.python-version }}"
            echo
            echo "Diagnostic publication was blocked by the privacy/security boundary. Only redacted control reports are eligible for upload."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sanitised scanned reliability evidence
        if: always() && steps.diagnostic_redaction.outcome == 'success' && steps.diagnostic_scan.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fifteen-pass-diagnostics-${{ matrix.python-version }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fifteen-pass-diagnostics
          if-no-files-found: error
          retention-days: 14
          compression-level: 9

      - name: Upload redacted control reports only
        if: always() && (steps.diagnostic_redaction.outcome == 'failure' || steps.diagnostic_scan.outcome == 'failure')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fifteen-pass-diagnostics-blocked-${{ matrix.python-version }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/diagnostic-redaction-report.json
            ${{ runner.temp }}/diagnostic-scan-report.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 9

      - name: Enforce privacy-safe diagnostic publication
        if: always() && (steps.diagnostic_redaction.outcome == 'failure' || steps.diagnostic_scan.outcome == 'failure')
        shell: bash
        run: exit 1
