name: Auditable fifteen-pass reliability gate

on:
  pull_request:
    paths:
      - ".github/workflows/fifteen-pass-verification.yml"
      - "scripts/ci/reliability_gate.py"
      - "requirements/ci-tools.txt"
      - "tests/test_reliability_gate.py"
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "examples/**"
      - "security/**"
      - "release/**"
      - "reference_runs/**"
      - "web/**"
      - "docs/**"
      - "citation/**"
      - "requirements/**"
      - "pyproject.toml"
      - "README.md"
      - "CHANGELOG.md"
      - "ROADMAP.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/fifteen-pass-verification.yml"
      - "scripts/ci/reliability_gate.py"
      - "requirements/ci-tools.txt"
      - "tests/test_reliability_gate.py"
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "examples/**"
      - "security/**"
      - "release/**"
      - "reference_runs/**"
      - "web/**"
      - "docs/**"
      - "citation/**"
      - "requirements/**"
      - "pyproject.toml"
      - "README.md"
      - "CHANGELOG.md"
      - "ROADMAP.md"
  workflow_dispatch:

permissions:
  contents: read

env:
  TZ: UTC
  LC_ALL: C.UTF-8
  LANG: C.UTF-8
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  SOURCE_DATE_EPOCH: "315532800"
  ARENA_RELIABILITY_STABLE_OUTPUT: "1"

concurrency:
  group: fifteen-pass-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Reliability Gate v2 — Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements/ci-tools.txt

      - name: Prepare bootstrap evidence
        shell: bash
        run: |
          set -euo pipefail
          diagnostics_dir="$RUNNER_TEMP/fifteen-pass-diagnostics"
          rm -rf "$diagnostics_dir"
          mkdir -p "$diagnostics_dir"
          {
            printf 'schema=reliability-gate-v2-bootstrap\n'
            printf 'python_label=%s\n' '${{ matrix.python-version }}'
            printf 'sha=%s\n' "$GITHUB_SHA"
            printf 'event=%s\n' "$GITHUB_EVENT_NAME"
            printf 'run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'run_attempt=%s\n' "$GITHUB_RUN_ATTEMPT"
            python --version
            python -m pip --version
          } > "$diagnostics_dir/bootstrap-environment.txt"

      - name: Install hash-locked CI toolchain
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input --require-hashes -r requirements/ci-tools.txt 2>&1 | tee "$RUNNER_TEMP/fifteen-pass-diagnostics/bootstrap-tools.log"

      - name: Install editable package without isolated dependency resolution
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input --no-build-isolation --editable . 2>&1 | tee "$RUNNER_TEMP/fifteen-pass-diagnostics/bootstrap-editable.log"

      - name: Run repository-owned reliability gate
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ci/reliability_gate.py \
            --passes 15 \
            --python-label '${{ matrix.python-version }}' \
            --workspace "$GITHUB_WORKSPACE" \
            --work-root "$RUNNER_TEMP/reliability-work" \
            --diagnostics-dir "$RUNNER_TEMP/fifteen-pass-diagnostics"

      - name: Publish reliability evidence summary
        if: always()
        shell: bash
        run: |
          diagnostics_dir="$RUNNER_TEMP/fifteen-pass-diagnostics"
          if [[ -f "$diagnostics_dir/summary.md" ]]; then
            cat "$diagnostics_dir/summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Reliability Gate v2 — Python ${{ matrix.python-version }}"
              echo
              echo "The gate did not reach summary generation. Bootstrap evidence is retained in the uploaded artifact."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload complete reliability evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fifteen-pass-diagnostics-${{ matrix.python-version }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fifteen-pass-diagnostics
          if-no-files-found: error
          retention-days: 30
          compression-level: 9