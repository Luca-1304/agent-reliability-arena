name: Repository history boundary

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify clean writable ancestry
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Fetch every writable origin branch
        run: git fetch --no-tags --prune origin '+refs/heads/*:refs/remotes/origin/*'

      - name: Verify clean history boundary and all writable branches
        run: python scripts/verify_history_boundary.py --verify-remote-branches

      - name: Classify remote branch lifecycle without mutation
        run: python scripts/ci/report_branch_lifecycle.py --policy branch-lifecycle-policy.json --output /tmp/branch-lifecycle.json

      - name: Summarize report-only branch lifecycle evidence
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          payload = json.loads(Path("/tmp/branch-lifecycle.json").read_text(encoding="utf-8"))
          assert payload["destructive_actions_supported"] is False
          rows = payload["branches"]
          assert all(row["deletion_authorized"] is False for row in rows)
          counts = Counter(row["lifecycle_class"] for row in rows)
          print(f"Branch lifecycle report: branch_count={len(rows)} destructive_actions_supported=false")
          print("Lifecycle classes: " + json.dumps(dict(sorted(counts.items())), sort_keys=True))
          print("deletion_authorized=false for every branch")
          print(json.dumps(payload, indent=2, sort_keys=True))
          PY
